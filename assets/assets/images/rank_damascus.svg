<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="damascusGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#404040;stop-opacity:1" />
      <stop offset="30%" style="stop-color:#2A2A2A;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#1A1A1A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#000000;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="damascusAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF4444;stop-opacity:0.8" />
      <stop offset="50%" style="stop-color:#CC2222;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#880000;stop-opacity:0.4" />
    </linearGradient>
    <linearGradient id="damascusHighlight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#666666;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#333333;stop-opacity:0.3" />
    </linearGradient>
  </defs>
  
  <!-- Main shield shape -->
  <path d="M50 3 L82 18 L92 35 L88 50 L92 65 L82 82 L50 97 L18 82 L8 65 L12 50 L8 35 L18 18 Z" 
        fill="url(#damascusGradient)" 
        stroke="#FF2222" 
        stroke-width="2"/>
  
  <!-- Red accent lines -->
  <path d="M50 8 L78 22 L85 38 L82 50 L85 62 L78 78 L50 92 L22 78 L15 62 L18 50 L15 38 L22 22 Z" 
        fill="none" 
        stroke="url(#damascusAccent)" 
        stroke-width="1.5" 
        opacity="0.9"/>
  
  <!-- Inner highlight -->
  <path d="M50 12 L75 25 L82 40 L79 50 L82 60 L75 75 L50 88 L25 75 L18 60 L21 50 L18 40 L25 25 Z" 
        fill="url(#damascusHighlight)" 
        opacity="0.6"/>
  
  <!-- Center emblem -->
  <path d="M50 18 L70 28 L78 42 L75 50 L78 58 L70 72 L50 82 L30 72 L22 58 L25 50 L22 42 L30 28 Z" 
        fill="#333333" 
        stroke="#FF2222" 
        stroke-width="1"/>
  
  <!-- Inner angular design -->
  <path d="M50 25 L65 32 L72 45 L68 50 L72 55 L65 68 L50 75 L35 68 L28 55 L32 50 L28 45 L35 32 Z" 
        fill="#1A1A1A" 
        stroke="#CC2222" 
        stroke-width="1" 
        opacity="0.9"/>
  
  <!-- Center diamond with red glow -->
  <path d="M50 35 L60 42 L62 50 L60 58 L50 65 L40 58 L38 50 L40 42 Z" 
        fill="#880000" 
        stroke="#FF4444" 
        stroke-width="1"/>
  
  <!-- Sharp accent lines -->
  <line x1="35" y1="35" x2="65" y2="65" stroke="#FF2222" stroke-width="1" opacity="0.6"/>
  <line x1="65" y1="35" x2="35" y2="65" stroke="#FF2222" stroke-width="1" opacity="0.6"/>
  
  <!-- Red glow effects -->
  <circle cx="50" cy="30" r="1.5" fill="#FF4444" opacity="0.8"/>
  <circle cx="70" cy="50" r="1" fill="#FF4444" opacity="0.7"/>
  <circle cx="30" cy="50" r="1" fill="#FF4444" opacity="0.7"/>
  <circle cx="50" cy="70" r="1.5" fill="#FF4444" opacity="0.8"/>
</svg> 