<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="diamondGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E6F3FF;stop-opacity:1" />
      <stop offset="20%" style="stop-color:#B3D9FF;stop-opacity:1" />
      <stop offset="60%" style="stop-color:#4D9AFF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1A5CFF;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="diamondHighlight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#B3D9FF;stop-opacity:0.3" />
    </linearGradient>
    <linearGradient id="diamondShine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:0.8" />
      <stop offset="50%" style="stop-color:#E6F3FF;stop-opacity:0.4" />
      <stop offset="100%" style="stop-color:#4D9AFF;stop-opacity:0.1" />
    </linearGradient>
  </defs>
  
  <!-- Main diamond shield shape -->
  <path d="M50 5 L80 22 L90 40 L85 50 L90 60 L80 78 L50 95 L20 78 L10 60 L15 50 L10 40 L20 22 Z" 
        fill="url(#diamondGradient)" 
        stroke="#0033CC" 
        stroke-width="2"/>
  
  <!-- Inner highlight -->
  <path d="M50 12 L75 26 L82 42 L78 50 L82 58 L75 74 L50 88 L25 74 L18 58 L22 50 L18 42 L25 26 Z" 
        fill="url(#diamondHighlight)" 
        opacity="0.8"/>
  
  <!-- Center diamond -->
  <path d="M50 18 L70 30 L78 45 L72 50 L78 55 L70 70 L50 82 L30 70 L22 55 L28 50 L22 45 L30 30 Z" 
        fill="#3377FF" 
        stroke="#0033CC" 
        stroke-width="1"/>
  
  <!-- Inner diamond facets -->
  <path d="M50 25 L65 35 L70 48 L65 52 L70 55 L65 65 L50 75 L35 65 L30 55 L35 52 L30 48 L35 35 Z" 
        fill="url(#diamondShine)" 
        opacity="0.7"/>
  
  <!-- Center crystal -->
  <path d="M50 35 L58 42 L60 50 L58 58 L50 65 L42 58 L40 50 L42 42 Z" 
        fill="#B3D9FF" 
        stroke="#1A5CFF" 
        stroke-width="1"/>
  
  <!-- Sparkle effects -->
  <circle cx="45" cy="35" r="2" fill="#FFFFFF" opacity="0.9"/>
  <circle cx="65" cy="42" r="1.5" fill="#FFFFFF" opacity="0.8"/>
  <circle cx="35" cy="58" r="1" fill="#FFFFFF" opacity="0.7"/>
</svg> 